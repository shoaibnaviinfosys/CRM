isplay:flex;justify-content:space-between;align-items:center;padding:5px 4px 11px;font-size:12px;font-weight:750}.kanban-count{background:#dce3ed;border-radius:20px;padding:2px 7px;color:#5d6b7d;font-size:10px}.kanban-list{min-height:275px;display:flex;flex-direction:column;gap:8px}.kanban-list.drag-over{background:#e0ebfb;border:1px dashed #79a5df;border-radius:9px}.lead-card{background:#fff;border:1px solid #e4e9f0;border-radius:9px;padding:11px;box-shadow:0 2px 4px #1d2e4610;cursor:grab}.lead-card:active{cursor:grabbing}.lead-card strong{display:block;font-size:12px;margin-bottom:3px}.lead-card small{color:var(--muted);font-size:10px}.lead-card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.empty{padding:35px;text-align:center;color:var(--muted);font-size:13px}.modal-backdrop{position:fixed;inset:0;background:#0e1b2dcc;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 25px 90px #06122655}.modal.wide{width:min(980px,100%)}.modal-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2}.modal-head h2{margin:0;font-size:18px}.modal-body{padding:22px 23px}.modal-foot{padding:15px 23px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;position:sticky;bottom:0;background:#fff}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-group{display:flex;flex-direction:column;gap:6px}.form-group label{font-size:11px;color:#5e6b7e;font-weight:700}.form-group.full{grid-column:1/-1}.form-group textarea{min-height:78px;resize:vertical}.divider-label{grid-column:1/-1;display:flex;align-items:center;gap:12px;color:#728096;font-size:10px;font-weight:800;letter-spacing:.1em;margin:8px 0 0}.divider-label:after{content:"";height:1px;background:var(--line);flex:1}.detail-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.detail-box{border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:13px}.detail-box h3{font-size:13px;margin:0 0 12px}.detail-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.meta-item small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.meta-item b{font-size:12px;word-break:break-word}.timeline{border-left:2px solid #e7edf5;margin-left:5px;padding-left:16px}.timeline-item{position:relative;padding:0 0 17px}.timeline-item:before{content:"";position:absolute;width:8px;height:8px;background:#6e9bd7;border-radius:50%;left:-21px;top:4px}.timeline-item strong{font-size:12px}.timeline-item p{margin:4px 0;color:#536176;font-size:12px;white-space:pre-wrap}.timeline-item small{color:#8a96a6;font-size:10px}.login-screen{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#27466d,#101b2d 55%);padding:20px}.login-card{width:min(420px,100%);background:white;border-radius:17px;padding:32px;box-shadow:0 30px 90px #06122666}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:25px}.login-card h1{font-size:23px;margin:0 0 5px}.login-card>p{color:var(--muted);margin:0 0 24px;font-size:13px}.login-card .form-group{margin-bottom:14px}.toast{position:fixed;right:22px;bottom:22px;background:#172a43;color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:50;font-size:12px;max-width:360px}.toast.error{background:#a63d3d}.badge-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#dc9a2c;margin-right:6px}.mobile-menu{display:none}.settings-grid{grid-template-columns:220px 1fr}.settings-nav button{width:100%;text-align:left;padding:10px;border:0;background:transparent;border-radius:8px;color:#617087}.settings-nav button.active{background:#eaf1fc;color:#2863ad;font-weight:700}.checkline{display:flex;gap:8px;align-items:center;font-size:12px}.muted-box{b @media(max-width:1050px){.sidebar{width:215px}.main{margin-left:215px}.content{padding:22px}.stats{grid-template-columns:repeat(2,1fr)}.kanban{grid-template-columns:repeat(6,210px)}}@media(max-width:720px){.sidebar{transform:translateX(-100%);transition:.2s;width:250px}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.topbar{padding:0 16px;height:62px}.mobile-menu{display:inline-flex}.content{padding:19px 14px 35px}.page-head{align-items:flex-start}.page-head h1{font-size:21px}.stats{gap:9px}.stat{padding:13px}.stat-num{font-size:23px}.division-grid{grid-template-columns:1fr}.mini-stats{gap:18px}.form-grid{grid-template-columns:1fr}.form-group.full,.divider-label{grid-column:1}.detail-grid{grid-template-columns:1fr}.modal-backdrop{padding:7px}.modal{max-height:96vh}.modal-body{padding:16px}.modal-head{padding:16px}.modal-foot{padding:12px 16px}.search{min-width:100%;flex-basis:100%}.toolbar .field{flex:1}.settings-grid{grid-template-columns:1fr}.page-head .btn{font-size:11px;padding:8px}}

/* Responsive save feedback and offline protection */
#networkProgress{position:fixed;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,#3978d6,#63b5ff,#3978d6);background-size:200% 100%;z-index:100;opacity:0;transition:opacity .2s,width .25s;}
#networkProgress.active{opacity:1;width:78%;animation:networkFlow 1.15s linear infinite}
#networkProgress.done{opacity:1;width:100%;animation:none}
@keyframes networkFlow{0%{background-position:100% 0}100%{background-position:-100% 0}}
.btn.is-loading{position:relative;pointer-events:none;opacity:.82;padding-right:34px}
.btn.is-loading:after{content:"";position:absolute;right:12px;top:50%;width:13px;height:13px;margin-top:-7px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#offlineNotice{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:101;background:#8b4e13;color:#fff;padding:8px 14px;border-radius:9px;font-size:12px;box-shadow:var(--shadow);display:none}
#offlineNotice.show{display:block}
.detail-loading{padding:34px;text-align:center;color:var(--muted)}
.detail-loading:after{content:"";display:block;width:34px;height:3px;margin:13px auto 0;background:linear-gradient(90deg,#d9e7fa,#3978d6,#d9e7fa);background-size:200% 100%;animation:networkFlow 1s linear infinite;border-radius:4px}
@media(prefers-reduced-motion:reduce){#networkProgress,.detail-loading:after,.btn.is-loading:after{animation:none}}

/* V1.3 interaction and pipeline affordances */
.lead-card{cursor:pointer;transition:border-color .14s,box-shadow .14s,transform .14s}.lead-card:hover{border-color:#8fb4e7;box-shadow:0 7px 18px rgba(37,85,145,.12);transform:translateY(-1px)}.lead-card .lead-name{cursor:pointer}.lead-card .lead-name:hover{color:var(--blue);text-decoration:underline;text-underline-offset:2px}.lead-card:active{cursor:grabbing}.top-actions #refreshWorkspace{white-space:nowrap}
</style>

<body>
<div id="networkProgress"></div><div id="offlineNotice">Connection lost. Your open form is being kept in this browser.</div><div id="root"></div>
<script>
const API='/api/crm';
const state={token:sessionStorage.getItem('navyToken')||'',user:null,boot:null,leads:[],division:'all',view:'all',layout:'table',q:'',status:'all',selected:null,detail:null,modal:null,users:[],busy:false,requests:0,detailRequest:0,selectedLeadView:'',leadFilters:{}};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,data={}){const bar=$('#networkProgress');state.requests++;if(bar){bar.classList.remove('done');bar.classList.add('active')}try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:state.token,...data}),signal:controller.signal,cache:'no-store'})}finally{clearTimeout(timer)}let j;try{j=await r.json()}catch{throw Error('The server returned an invalid response. Check your Apps Script deployment.')}if(!j.ok)throw Error(j.error||'Request failed');return j.data}catch(e){if(!navigator.onLine)throw Error('Internet connection lost. Your current form is still available; reconnect and try again.');if(e.name==='AbortError')throw Error('The server is taking too long to respond. Please retry.');throw e}finally{state.requests=Math.max(0,state.requests-1);if(bar&&state.requests===0){bar.classList.remove('active');bar.classList.add('done');setTimeout(()=>bar.classList.remove('done'),250)}}}
function setBusy(btn,busy,label='Saving…'){if(!btn)return;if(busy){if(!btn.classList.contains('is-loading')){btn.dataset.oldText=btn.textContent;btn.dataset.wasDisabled=btn.disabled?'1':'0'}btn.textContent=label;btn.classList.add('is-loading');btn.disabled=true}else{btn.textContent=btn.dataset.oldText||btn.textContent;btn.classList.remove('is-loading');btn.disabled=btn.dataset.wasDisabled==='1'}}
function draftKey(){return 'navy-crm-draft-'+(state.user?.userId||'guest')}
function keepFormDraft(form,kind){if(!form)return;try{localStorage.setItem(draftKey()+'-'+kind,JSON.stringify({savedAt:new Date().toISOString(),values:Object.fromEntries(new FormData(form).entries())}))}catch(e){}}
function restoreFormDraft(form,kind){try{const raw=localStorage.getItem(draftKey()+'-'+kind);if(!raw)return;const d=JSON.parse(raw);if(Date.now()-new Date(d.savedAt).getTime()>7*86400000){localStorage.removeItem(draftKey()+'-'+kind);return}if(confirm('A saved unsent '+kind+' draft was found from '+dateFmt(d.savedAt,true)+'. Restore it?'))Object.entries(d.values||{}).forEach(([k,v])=>{const el=form.elements[k];if(el)el.value=v})}catch(e){}}
function clearFormDraft(kind){try{localStorage.removeItem(draftKey()+'-'+kind)}catch(e){}}
if(!navigator.onLine)$('#offlineNotice')?.classList.add('show');window.addEventListener('offline',()=>$('#offlineNotice')?.classList.add('show'));window.addEventListener('online',()=>{$('#offlineNotice')?.classList.remove('show');toast('Connection restored. You can safely retry any unsaved action.')});
function toast(msg,error=false){const n=document.createElement('div');n.className='toast'+(error?' error':'');n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),3600)}
function initials(n){return (n||'U').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function canAdmin(){return state.user?.role==='admin'}function canManage(){return ['admin','manager'].includes(state.user?.role)}function canTakeover(){return canManage()||state.user?.permissions?.takeover===true}
function divisionName(d){return d==='academic'?'Navy Infosys Academy':'Service Division'}
function statusName(s){return state.boot?.statuses?.find(x=>x.statusId===s)?.name||s||'New'}
function statusClass(s){return ({new:'blue',contacted:'gray',interested:'green',followup:'amber',converted:'green',lost:'red'})[s]||'gray'}
function dateFmt(v,withTime=false){if(!v)return '—';const d=new Date(v);if(isNaN(d))return v;return d.toLocaleString([],withTime?{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}:{day:'2-digit',month:'short',year:'numeric'})}
function dueClass(v){return v&&new Date(v)<new Date()?'due':''}
function loginView(){ $('#root').innerHTML=`<div class="login-screen"><form class="login-card" id="loginForm"><div class="login-brand"><div class="brand-mark">N</div><div><strong style="color:#14243b;letter-spacing:.1em">NAVY INFOSYS</strong><span style="color:#8190a4;display:block">LEAD MANAGEMENT CRM</span></div></div><h1>Welcome back</h1><p>Sign in to manage your leads and follow-ups.</p><div class="form-group"><label>Email address</label><input class="field" type="email" name="email" required autocomplete="username" placeholder="you@company.com"></div><div class="form-group"><label>Password</label><input class="field" type="password" name="password" required autocomplete="current-password" placeholder="Enter your password"></div><button class="btn primary" style="width:100%;justify-content:center;margin-top:8px">Sign in to CRM</button><p id="loginError" class="small" style="color:#b74440;margin:12px 0 0"></p></form></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const x=await api('login',{email:f.get('email'),password:f.get('password')});state.token=x.token;sessionStorage.setItem('navyToken',x.token);state.user=x.user;await loadBoot();render()}catch(err){$('#loginError').textContent=err.message}}}
async function loadBoot(){state.boot=await api('bootstrap');state.user=state.boot.user;state.leads=state.boot.leads||[];state.users=state.boot.users||[]}
function shell(){return `<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">N</div><div><strong>NAVY INFOSYS</strong><span>CRM WORKSPACE</span></div></div><nav class="nav"><div class="nav-label">WORKSPACE</div><button data-page="home" class="active"><span class="ico">▦</span>Overview</button><button data-page="leads"><span class="ico">♧</span>All Leads</button><button data-page="followups"><span class="ico">◷</span>Follow-ups <span id="navDue" class="pill amber" style="margin-left:auto">0</span></button><button data-page="activities"><span class="ico">↺</span>Activity Log</button><div class="nav-label">DIVISIONS</div><button data-page="service"><span class="ico">▣</span>Service Division</button><button data-page="academic"><span class="ico">⌂</span>Navy Infosys Academy</button><div class="nav-label ${canManage()?'':'hidden'}">MANAGEMENT</div><button data-page="employees" class="${canManage()?'':'hidden'}"><span class="ico">♙</span>Employees</button><button data-page="reports" class="${canManage()?'':'hidden'}"><span class="ico">▤</span>Reports</button><button data-page="import"><span class="ico">⇧</span>Bulk Import${canManage()?' / Export':''}</button><button data-page="settings" class="${canAdmin()?'':'hidden'}"><span class="ico">⚙</span>Admin Settings</button></nav><div class="sidebar-bottom"><div class="profile"><div class="avatar">${initials(state.user.name)}</div><div style="min-width:0;flex:1"><strong>${esc(state.user.name)}</strong><small>${esc(state.user.role)} · Navy CRM</small></div><button class="btn sm" id="logout" title="Sign out">↗</button></div></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn">☰</button><div class="crumb">Navy Infosys <span style="color:#b3bdca">/</span> <b id="crumb">Overview</b></div></div><div class="top-actions"><button class="btn sm" id="refreshWorkspace" title="Refresh leads, employees and settings">↻ Refresh data</button><span class="small muted">${new Date().toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'})}</span><div class="avatar">${initials(state.user.name)}</div></div></header><div class="content" id="page"></div></main>`}
function render(){if(!state.user){loginView();return}$('#root').innerHTML=shell();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#logout').onclick=logout;$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#refreshWorkspace').onclick=refreshWorkspace;go('home')}
async function logout(){try{await api('logout')}catch{}sessionStorage.removeItem('navyToken');state.token='';state.user=null;loginView()}
function go(page){state.page=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sidebar').classList.remove('open');const names={home:'Overview',leads:'Lead Management',followups:'Follow-ups',activities:'Activity Log',service:'Service Division',academic:'Navy Infosys Academy',employees:'Employees',reports:'Reports',import:'Import / Export',settings:'Admin Settings'};$('#crumb').textContent=names[page]||page;renderPage()}
async function refreshLeads(){state.leads=await api('listLeads',{division:state.division==='all'?'all':state.division});}
async function refreshWorkspace(){const b=$('#refreshWorkspace');setBusy(b,true,'Refreshing…');try{const page=state.page||'home';await loadBoot();state.page=page;renderPage();toast('Workspace data refreshed.')}catch(e){toast('Refresh failed: '+e.message,true)}finally{setBusy(b,false)}}
function isFinalStageClient(status){return ['converted','lost'].includes(status)||state.boot?.statuses?.some(s=>s.statusId===status&&(s.isFinal===true||s.isFinal==='true'))}function dueLeads(list=state.leads){return list.filter(l=>l.nextFollowupAt&&!isFinalStageClient(l.status)&&new Date(l.nextFollowupAt)<=new Date())}

function settingPanel(tab){const p=$('#settingPanel');if(tab==='fields'){const core=state.boot.fieldConfig||[];p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 class="section-title">Core lead fields</h2><button class="btn primary sm" id="addCustomField">＋ Add custom field</button></div><p class="small muted">Control which core fields appear on the lead form and whether they are compulsory. Custom fields are stored separately from the core lead columns.</p><div class="table-wrap"><table class="table"><thead><tr><th>Field</th><th>Division</th><th>Section</th><th>Required</th><th>Visible</th><th></th></tr></thead><tbody>${core.map(f=>`<tr><td><b>${esc(f.label)}</b><div class="small muted">${esc(f.fieldKey)}</div></td><td>${esc(f.division)}</td><td>${esc(f.section)}</td><td><input type="checkbox" data-fcreq="${f.fieldKey}" ${String(f.required)==='true'?'checked':''}></td><td><input type="checkbox" data-fcvis="${f.fieldKey}" ${String(f.visible)==='true'?'checked':''}></td><td><button class="btn sm" data-savefc="${f.fieldKey}">Save</button></td></tr>`).join('')}</tbody></table></div><h3 class="section-title" style="margin-top:22px">Additional custom fields</h3><div class="table-wrap"><table class="table"><thead><tr><th>Label</th><th>Field ID</th><th>Division</th><th>Type</th><th>Required</th><th>Visible</th></tr></thead><tbody>${(state.boot.customFields||[]).map(f=>`<tr><td>${esc(f.label)}</td><td>${esc(f.fieldId)}</td><td>${esc(f.division)}</td><td>${esc(f.type)}</td><td>${String(f.required)==='true'?'Yes':'No'}</td><td>${String(f.visible)==='true'?'Yes':'No'}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No custom fields created.</td></tr>'}</tbody></table></div>`;document.querySelectorAll('[data-savefc]').forEach(b=>b.onclick=async()=>{const key=b.dataset.savefc,f=core.find(x=>x.fieldKey===key);f.required=$(`[data-fcreq="${key}"]`).checked;f.visible=$(`[data-fcvis="${key}"]`).checked;try{await api('saveFieldConfig',{field:f});await loadBoot();settingPanel('fields');toast('Field settings saved.')}catch(e){toast(e.message,true)}});$('#addCustomField').onclick=customFieldModal;}else if(['stages','sources','reasons'].includes(tab)){const cfg={stages:{title:'Lead stages',sheet:'STATUSES',items:state.boot.statuses,id:'statusId'},sources:{title:'Lead sources',sheet:'SOURCES',items:state.boot.sources,id:'sourceId'},reasons:{title:'Lost reasons',sheet:'LOST_REASONS',items:state.boot.lostReasons,id:'reasonId'}}[tab];p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="section-title">${cfg.title}</h2><button class="btn primary sm" id="addReference">＋ Add</button></div><p class="small muted">Manage the options used throughout the CRM. Deactivated items remain on historical records.</p><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>ID</th><th>Division</th><th>Active</th><th></th></tr></thead><tbody>${cfg.items.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x[cfg.id])}</td><td>${esc(x.division||'both')}</td><td>${String(x.active)==='true'?'Yes':'No'}</td><td><button class="btn sm" data-editref="${esc(x[cfg.id])}">Edit</button></td></tr>`).join('')}</tbody></table></div>`;$('#addReference').onclick=()=>referenceModal(cfg,null);document.querySelectorAll('[data-editref]').forEach(b=>b.onclick=()=>referenceModal(cfg,cfg.items.find(x=>x[cfg.id]===b.dataset.editref)));}else if(tab==='permissions'){p.innerHTML=`<h2 class="section-title">Employee permissions</h2><p class="small muted">Permissions are set per user in the Employees sheet / user record. Use the employee creation form for initial permissions.</p><div class="muted-box"><b>viewAllLeads</b> — view all leads in permitted divisions.<br><b>takeover</b> — take ownership of another employee's lead.<br><b>editUnassigned</b> — edit unassigned leads.<br><br>Example JSON: <code>{"viewAllLeads":true,"takeover":true,"editUnassigned":true}</code></div>`}else if(tab==='scoring'){const cfg=state.boot.scoring||{enabled:true,weights:{contact:15,email:10,interest:15,source:10,highPriority:15,mediumPriority:8,lowPriority:-5,followup:15,recentActivity:10},bands:{hot:70,warm:40}};const labels={contact:'Phone number available',email:'Email available',interest:'Interested program/service recorded',source:'Lead source known',highPriority:'High priority',mediumPriority:'Medium priority',lowPriority:'Low priority',followup:'Follow-up scheduled',recentActivity:'Recent activity within 7 days'};p.innerHTML=`<h2 class="section-title">Explainable lead scoring</h2><p class="small muted">Scores are rule-based indicators, not guaranteed conversion probabilities. Adjust points based on your own historical results.</p><label class="checkline"><input type="checkbox" id="scoreEnabled" ${cfg.enabled!==false?'checked':''}> Enable lead scoring</label><div class="table-wrap" style="margin-top:14px"><table class="table"><thead><tr><th>Signal</th><th>Points (+ / −)</th></tr></thead><tbody>${Object.keys(labels).map(k=>`<tr><td>${labels[k]}</td><td><input class="field" style="max-width:110px" type="number" id="score_${k}" value="${Number(cfg.weights?.[k]??0)}"></td></tr>`).join('')}</tbody></table></div><div class="form-grid" style="margin-top:12px"><div class="form-group"><label>Hot score threshold</label><input class="field" type="number" id="scoreHot" min="0" max="100" value="${cfg.bands?.hot??70}"></div><div class="form-group"><label>Warm score threshold</label><input class="field" type="number" id="scoreWarm" min="0" max="100" value="${cfg.bands?.warm??40}"></div></div><div class="muted-box" style="margin-top:12px">Scoring signals: contactability, known interest, source, priority, scheduled follow-up and recent activity. Scores are capped between 0 and 100. Review conversion outcomes regularly before changing weights.</div><button class="btn primary" id="saveScoring" style="margin-top:14px">Save scoring rules</button>`;$('#saveScoring').onclick=async()=>{const weights={};Object.keys(labels).forEach(k=>weights[k]=Number($('#score_'+k).value)||0);const scoring={enabled:$('#scoreEnabled').checked,weights,bands:{hot:Number($('#scoreHot').value)||70,warm:Number($('#scoreWarm').value)||40}};try{await api('saveSettings',{settings:{leadScoring:scoring}});await loadBoot();settingPanel('scoring');toast('Lead scoring rules saved.')}catch(e){toast(e.message,true)}}}else if(tab==='integrations'){integrationSettings(p)}else{p.innerHTML=`<h2 class="section-title">Database & backup</h2><p class="small muted">Your Google Spreadsheet is the portable source of truth.</p><div class="muted-box">Run <b>createDailyBackupTrigger()</b> once from Apps Script to create a daily copy of the CRM spreadsheet in Google Drive. Run <b>backupDatabase()</b> manually to create an immediate backup. Keep an independent XLSX export too.</div><a class="btn" target="_blank" rel="noopener" href="https://drive.google.com/drive/my-drive">Open Google Drive ↗</a>`}}
async function integrationSettings(p){
  p.innerHTML=`<div class="page-head" style="margin-bottom:12px"><div><h2 class="section-title">Integration centre</h2><p class="small muted">Connect lead sources and business tools. Credentials are stored server-side, not in the browser or Google Sheets.</p></div><button class="btn sm" id="refreshIntegrations">↻ Refresh</button></div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px"><div class="card panel"><div style="font-size:22px">📣</div><b>Meta Lead Ads</b><p class="small muted">Facebook & Instagram Instant Forms · Direct lead import</p><span class="pill blue">Setup available</span></div><div class="card panel"><div style="font-size:22px">🔗</div><b>Webhook / Website Forms</b><p class="small muted">Connect website forms, landing pages, n8n, Make or Zapier.</p><span class="pill blue">Setup available</span></div><div class="card panel"><div style="font-size:22px">📝</div><b>Google Forms</b><p class="small muted">Send form responses into the correct CRM division.</p><span class="pill gray">Planned</span></div><div class="card panel"><div style="font-size:22px">💬</div><b>WhatsApp Business</b><p class="small muted">Messaging and conversation workflows.</p><span class="pill gray">Planned</span></div><div class="card panel"><div style="font-size:22px">✉️</div><b>Email & SMS</b><p class="small muted">Notifications and follow-up automation.</p><span class="pill gray">Planned</span></div><div class="card panel"><div style="font-size:22px">📅</div><b>Google Calendar</b><p class="small muted">Follow-up reminders and calendar events.</p><span class="pill gray">Planned</span></div></div><div class="card panel" id="inboundIntegrationPanel"><div class="muted">Loading webhook settings…</div></div><div class="card panel" id="metaIntegrationPanel"><div class="muted">Loading Meta connection settings…</div></div><div class="card panel" style="margin-top:14px"><h3 class="section-title">Recent integration activity</h3><div id="integrationLogs" class="small muted">Loading…</div></div>`;
  $('#refreshIntegrations').onclick=()=>integrationSettings(p);
  try{const data=await api('getIntegrationConfig');const m=data.meta||{},w=data.inbound||{};const users=state.users.filter(u=>u.active&&u.role!=='admin');
    $('#inboundIntegrationPanel').innerHTML=`<h3 class="section-title">🔗 Generic inbound webhook</h3><p class="small muted">Use one secure endpoint to receive leads from your website, Google Forms, Make, Zapier or n8n.</p><div class="muted-box" style="margin:10px 0"><b>Endpoint</b><br><code>${esc(location.origin+w.endpoint)}</code> <button class="btn sm" id="copyInboundUrl">Copy URL</button></div><form id="inboundConfigForm"><div class="form-grid"><div class="form-group"><label>Webhook secret ${w.configured?'(saved; leave blank to keep)':'*'}</label><input class="field" type="password" name="webhookKey" minlength="24" autocomplete="new-password" placeholder="At least 24 characters" ${w.configured?'':'required'}></div><div class="form-group"><label>Default division</label><select class="field" name="defaultDivision"><option value="academic" ${w.defaultDivision==='academic'?'selected':''}>Navy Infosys Academy</option><option value="service" ${w.defaultDivision==='service'?'selected':''}>Service</option></select></div><div class="form-group"><label>Default program / service</label><input class="field" name="defaultProgram" value="${esc(w.defaultProgram||'')}"></div><div class="form-group"><label>Default source</label><select class="field" name="defaultSource"><option value="website" ${w.defaultSource==='website'?'selected':''}>Website</option><option value="google_forms" ${w.defaultSource==='google_forms'?'selected':''}>Google Forms</option><option value="zapier" ${w.defaultSource==='zapier'?'selected':''}>Zapier</option><option value="make" ${w.defaultSource==='make'?'selected':''}>Make</option><option value="n8n" ${w.defaultSource==='n8n'?'selected':''}>n8n</option></select></div><div class="form-group"><label>Default lead owner</label><select class="field" name="defaultAssignedTo"><option value="">Leave unassigned</option>${users.map(u=>`<option value="${esc(u.userId)}" ${w.defaultAssignedTo===u.userId?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div></div><button class="btn primary" style="margin-top:12px">Save webhook settings</button></form><details style="margin-top:14px"><summary class="small">Example JSON payload</summary><pre class="muted-box" style="white-space:pre-wrap;overflow-wrap:anywhere">{
  "name": "Example Lead",
  "phone": "+9779800000000",
  "email": "lead@example.com",
  "division": "academic",
  "program": "Digital Marketing",
  "source": "website"
}</pre><p class="small muted">Send the JSON to the endpoint with an Authorization header: Bearer YOUR_WEBHOOK_SECRET. Use an Idempotency-Key header when possible.</p></details>`;
    $('#copyInboundUrl').onclick=()=>navigator.clipboard.writeText(location.origin+w.endpoint).then(()=>toast('Webhook URL copied.')).catch(()=>toast('Could not copy URL.',true));
    $('#inboundConfigForm').onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(e.currentTarget).entries());try{await api('saveInboundIntegration',{config:x});toast('Inbound webhook settings saved securely.');integrationSettings(p);}catch(err){toast(err.message,true)}};
    $('#metaIntegrationPanel').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h3 class="section-title" style="margin:0">📣 Meta Lead Ads connection</h3><p class="small muted">Receive new Facebook and Instagram Instant Form leads automatically.</p></div><span class="pill ${m.configured?'green':'amber'}">${m.configured?'Credentials saved':'Not configured'}</span></div><div class="muted-box" style="margin:12px 0"><b>Webhook callback URL</b><br><code id="metaWebhookUrl">${esc(location.origin+m.webhookPath)}</code> <button class="btn sm" id="copyMetaWebhook">Copy URL</button><br><span class="small">Use this URL in Meta for Developers → Webhooks → Page → leadgen.</span></div><form id="metaConfigForm"><div class="form-grid"><div class="form-group"><label>Meta App ID *</label><input class="field" name="appId" required value="${esc(m.appId)}" placeholder="Your Meta App ID"></div><div class="form-group"><label>Facebook Page ID *</label><input class="field" name="pageId" required value="${esc(m.pageId)}" placeholder="Page ID connected to Lead Ads"></div><div class="form-group"><label>Meta App Secret ${m.hasAppSecret?'(saved; leave blank to keep)':'*'}</label><input class="field" type="password" name="appSecret" autocomplete="new-password" placeholder="${m.hasAppSecret?'Saved securely — enter only to replace':''}" ${m.hasAppSecret?'':'required'}></div><div class="form-group"><label>Page Access Token ${m.hasPageToken?'(saved; leave blank to keep)':'*'}</label><input class="field" type="password" name="pageAccessToken" autocomplete="new-password" placeholder="${m.hasPageToken?'Saved securely — enter only to replace':''}" ${m.hasPageToken?'':'required'}></div><div class="form-group"><label>Webhook Verify Token ${m.verifyTokenSet?'(saved; leave blank to keep)':'*'}</label><input class="field" type="password" name="verifyToken" autocomplete="new-password" placeholder="Choose a long random string" ${m.verifyTokenSet?'':'required'}></div><div class="form-group"><label>Default CRM division</label><select class="field" name="defaultDivision"><option value="academic" ${m.defaultDivision==='academic'?'selected':''}>Navy Infosys Academy</option><option value="service" ${m.defaultDivision==='service'?'selected':''}>Service</option></select></div><div class="form-group"><label>Default program / service</label><input class="field" name="defaultProgram" value="${esc(m.defaultProgram)}" placeholder="e.g. Digital Marketing"></div><div class="form-group"><label>Default priority</label><select class="field" name="defaultPriority"><option ${m.defaultPriority==='High'?'selected':''}>High</option><option ${!m.defaultPriority||m.defaultPriority==='Medium'?'selected':''}>Medium</option><option ${m.defaultPriority==='Low'?'selected':''}>Low</option></select></div><div class="form-group"><label>Default lead owner</label><select class="field" name="defaultAssignedTo"><option value="">Leave unassigned</option>${users.map(u=>`<option value="${esc(u.userId)}" ${m.defaultAssignedTo===u.userId?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div class="form-group full"><label>Optional form-specific mapping</label><textarea class="field" name="formMappings" rows="4" placeholder="One form per line: FORM_ID | division | program/service | employee_user_id">${esc(m.formMappings||'')}</textarea><span class="small muted">Example: 123456789 | academic | Video Editing | USR-123. Leave blank to use the defaults above.</span></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn primary" type="submit" id="saveMetaConfig">Save Meta settings</button><button class="btn" type="button" id="testMetaConnection" ${m.configured?'':'disabled'}>Test connection</button></div><p class="small muted" style="margin-top:12px">Meta may require app review, business verification and lead-retrieval permissions before production leads can be accessed. Use a Page access token with the required Page access.</p></form>`;
    $('#copyMetaWebhook').onclick=()=>navigator.clipboard.writeText(location.origin+m.webhookPath).then(()=>toast('Webhook URL copied.')).catch(()=>toast('Could not copy URL.',true));
    $('#metaConfigForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,x=Object.fromEntries(new FormData(f).entries());const btn=$('#saveMetaConfig');setBusy(btn,true,'Saving…');try{const result=await api('saveMetaIntegration',{config:x});toast('Meta settings saved securely.');integrationSettings(p);}catch(err){toast(err.message,true)}finally{setBusy(btn,false)}};
    $('#testMetaConnection').onclick=async()=>{const b=$('#testMetaConnection');setBusy(b,true,'Testing…');try{const r=await api('testMetaIntegration');toast('Connected to Facebook Page: '+r.pageName);}catch(e){toast(e.message,true)}finally{setBusy(b,false)}};
    const logs=data.logs||[];$('#integrationLogs').innerHTML=logs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Provider</th><th>Event / Lead ID</th><th>Status</th><th>Message</th><th>Time</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${esc(l.provider)}</td><td>${esc(l.eventId||l.leadId||'—')}</td><td><span class="pill ${l.status==='success'?'green':l.status==='failed'?'red':'amber'}">${esc(l.status)}</span></td><td>${esc(l.message)}</td><td>${dateFmt(l.createdAt,true)}</td></tr>`).join('')}</tbody></table></div>`:'No integration events yet.';
  }catch(e){$('#inboundIntegrationPanel').innerHTML=`<p class="small" style="color:#b74440">Webhook settings unavailable: ${esc(e.message)}</p>`;$('#metaIntegrationPanel').innerHTML=`<p class="small" style="color:#b74440">Could not load integration settings: ${esc(e.message)}</p>`;$('#integrationLogs').textContent='Logs unavailable.'}
}

function customFieldModal(){showModal('Add custom lead field',`<form id="customFieldForm"><div class="form-grid"><div class="form-group"><label>Field label *</label><input class="field" name="label" required placeholder="e.g. Preferred batch"></div><div class="form-group"><label>Unique field ID *</label><input class="field" name="fieldId" required placeholder="preferredBatch"></div><div class="form-group"><label>Division</label><select class="field" name="division"><option value="both">Both divisions</option><option value="service">Service</option><option value="academic">Academy</option></select></div><div class="form-group"><label>Field type</label><select class="field" name="type"><option value="text">Text</option><option value="number">Number</option><option value="date">Date</option><option value="select">Dropdown</option><option value="textarea">Long text</option></select></div><div class="form-group"><label>Dropdown options (comma separated)</label><input class="field" name="options" placeholder="Morning, Afternoon, Evening"></div><div class="form-group"><label>Section</label><select class="field" name="section"><option value="additional">Additional information</option><option value="essential">Essential information</option></select></div><div class="form-group"><label><input type="checkbox" name="required"> Required</label></div><div class="form-group"><label><input type="checkbox" name="visible" checked> Visible</label></div></div></form>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="saveCustomField">Create field</button>`);$('#saveCustomField').onclick=async()=>{const f=$('#customFieldForm');if(!f.reportValidity())return;const x=Object.fromEntries(new FormData(f).entries());x.required=f.required.checked;x.visible=f.visible.checked;x.active=true;x.optionsJson=JSON.stringify((x.options||'').split(',').map(s=>s.trim()).filter(Boolean));x.sortOrder=100;delete x.options;try{await api('saveCustomField',{field:x});await loadBoot();closeModal();settingPanel('fields');toast('Custom field created.')}catch(e){toast(e.message,true)}}}
function referenceModal(cfg,item){const id=cfg.id;showModal(item?'Edit '+cfg.title:'Add '+cfg.title,`<form id="referenceForm"><div class="form-grid"><div class="form-group"><label>Name *</label><input class="field" name="name" required value="${esc(item?.name||'')}"></div><div class="form-group"><label>Stable ID *</label><input class="field" name="${id}" required value="${esc(item?.[id]||'')}" ${item?'readonly':''} placeholder="e.g. new-stage"></div><div class="form-group"><label>Division</label><select class="field" name="division"><option value="both" ${!item||item.division==='both'?'selected':''}>Both</option><option value="service" ${item?.division==='service'?'selected':''}>Service</option><option value="academic" ${item?.division==='academic'?'selected':''}>Academy</option></select></div>${cfg.sheet==='STATUSES'?`<div class="form-group"><label>Order</label><input class="field" name="sortOrder" type="number" value="${esc(item?.sortOrder||10)}"></div><div class="form-group"><label><input type="checkbox" name="isFinal" ${String(item?.isFinal)==='true'?'checked':''}> Final stage</label></div>`:''}<div class="form-group"><label><input type="checkbox" name="active" ${!item||String(item.active)==='true'?'checked':''}> Active</label></div></div></form>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="saveReference">Save</button>`);$('#saveReference').onclick=async()=>{const f=$('#referenceForm');if(!f.reportValidity())return;const x=Object.fromEntries(new FormData(f).entries());x.active=f.active.checked;if(cfg.sheet==='STATUSES')x.isFinal=f.isFinal.checked;try{await api('saveReference',{sheetName:cfg.sheet,item:x});await loadBoot();closeModal();settingPanel(cfg.sheet==='STATUSES'?'stages':cfg.sheet==='SOURCES'?'sources':'reasons');toast('Configuration saved.')}catch(e){toast(e.message,true)}}}
// Boot
(async()=>{if(!state.token){loginView();return}try{await loadBoot();render()}catch(e){sessionStorage.removeItem('navyToken');state.token='';loginView()}})();
</script>
</body></html>
