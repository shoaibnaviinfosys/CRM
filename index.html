<style>

stats{display:flex;gap:24px;margin:19px 0 15px}.mini-stats b{display:block;font-size:20px}.mini-stats span{font-size:11px;color:var(--muted)}.div-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:13px;color:var(--blue);font-weight:650;font-size:12px}.section-title{font-size:15px;margin:0 0 13px}.panel{padding:18px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.field{border:1px solid #dce3ed;background:#fff;border-radius:8px;padding:9px 11px;color:var(--ink);min-width:0;outline:none}.field:focus{border-color:#78a6e8;box-shadow:0 0 0 3px #eaf2ff}.search{min-width:220px;flex:1}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;color:#7a8798;font-size:10px;text-transform:uppercase;letter-spacing:.08em;padding:12px;border-bottom:1px solid var(--line);font-weight:700}.table td{padding:13px 12px;border-bottom:1px solid #f0f2f6;font-size:12px}.table tr:hover td{background:#fbfcfe}.lead-name{font-weight:700;color:#1e2b40;cursor:pointer}.lead-name:hover{color:var(--blue)}.pill{display:inline-flex;align-items:center;padding:4px 8px;border-radius:20px;background:#eef2f7;color:#556477;font-size:10px;font-weight:700}.pill.blue{background:#eaf2ff;color:#2f66b0}.pill.green{background:#e8f6ef;color:#14734e}.pill.red{background:#fff0ef;color:#b74440}.pill.amber{background:#fff6e6;color:#9c6815}.pill.gray{background:#f0f2f5;color:#667386}.due{color:#bc4c43;font-weight:700}.views{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}.view-btn{border:1px solid transparent;background:transparent;color:#69778a;padding:7px 11px;border-radius:8px;font-size:12px;font-weight:650}.view-btn.active{background:#eaf1fc;color:#2b65b0}.kanban{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:12px;overflow:auto;padding-bottom:10px}.kanban-col{background:#edf1f6;border-radius:11px;padding:10px;min-height:330px}.kanban-head{display:flex;justify-content:space-between;align-items:center;padding:5px 4px 11px;font-size:12px;font-weight:750}.kanban-count{background:#dce3ed;border-radius:20px;padding:2px 7px;color:#5d6b7d;font-size:10px}.kanban-list{min-height:275px;display:flex;flex-direction:column;gap:8px}.kanban-list.drag-over{background:#e0ebfb;border:1px dashed #79a5df;border-radius:9px}.lead-card{background:#fff;border:1px solid #e4e9f0;border-radius:9px;padding:11px;box-shadow:0 2px 4px #1d2e4610;cursor:grab}.lead-card:active{cursor:grabbing}.lead-card strong{display:block;font-size:12px;margin-bottom:3px}.lead-card small{color:var(--muted);font-size:10px}.lead-card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.empty{padding:35px;text-align:center;color:var(--muted);font-size:13px}.modal-backdrop{position:fixed;inset:0;background:#0e1b2dcc;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 25px 90px #06122655}.modal.wide{width:min(980px,100%)}.modal-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:2}.modal-head h2{margin:0;font-size:18px}.modal-body{padding:22px 23px}.modal-foot{padding:15px 23px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;position:sticky;bottom:0;background:#fff}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-group{display:flex;flex-direction:column;gap:6px}.form-group label{font-size:11px;color:#5e6b7e;font-weight:700}.form-group.full{grid-column:1/-1}.form-group textarea{min-height:78px;resize:vertical}.divider-label{grid-column:1/-1;display:flex;align-items:center;gap:12px;color:#728096;font-size:10px;font-weight:800;letter-spacing:.1em;margin:8px 0 0}.divider-label:after{content:"";height:1px;background:var(--line);flex:1}.detail-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.detail-box{border:1px solid var(--line);border-radius:11px;padding:15px;margin-bottom:13px}.detail-box h3{font-size:13px;margin:0 0 12px}.detail-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.meta-item small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.meta-item b{font-size:12px;word-break:break-word}.timeline{border-left:2px solid #e7edf5;margin-left:5px;padding-left:16px}.timeline-item{position:relative;padding:0 0 17px}.timeline-item:before{content:"";position:absolute;width:8px;height:8px;background:#6e9bd7;border-radius:50%;left:-21px;top:4px}.timeline-item strong{font-size:12px}.timeline-item p{margin:4px 0;color:#536176;font-size:12px;white-space:pre-wrap}.timeline-item small{color:#8a96a6;font-size:10px}.login-screen{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#27466d,#101b2d 55%);padding:20px}.login-card{width:min(420px,100%);background:white;border-radius:17px;padding:32px;box-shadow:0 30px 90px #06122666}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:25px}.login-card h1{font-size:23px;margin:0 0 5px}.login-card>p{color:var(--muted);margin:0 0 24px;font-size:13px}.login-card .form-group{margin-bottom:14px}.toast{position:fixed;right:22px;bottom:22px;background:#172a43;color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:50;font-size:12px;max-width:360px}.toast.error{background:#a63d3d}.badge-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#dc9a2c;margin-right:6px}.mobile-menu{display:none}.settings-grid{grid-template-columns:220px 1fr}.settings-nav button{width:100%;text-align:left;padding:10px;border:0;background:transparent;border-radius:8px;color:#617087}.settings-nav button.active{background:#eaf1fc;color:#2863ad;font-weight:700}.checkline{display:flex;gap:8px;align-items:center;font-size:12px}.muted-box{background:#f6f8fb;padding:12px;border-radius:9px;color:#69778a;font-size:11px}
@media(max-width:1050px){.sidebar{width:215px}.main{margin-left:215px}.content{padding:22px}.stats{grid-template-columns:repeat(2,1fr)}.kanban{grid-template-columns:repeat(6,210px)}}@media(max-width:720px){.sidebar{transform:translateX(-100%);transition:.2s;width:250px}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.topbar{padding:0 16px;height:62px}.mobile-menu{display:inline-flex}.content{padding:19px 14px 35px}.page-head{align-items:flex-start}.page-head h1{font-size:21px}.stats{gap:9px}.stat{padding:13px}.stat-num{font-size:23px}.division-grid{grid-template-columns:1fr}.mini-stats{gap:18px}.form-grid{grid-template-columns:1fr}.form-group.full,.divider-label{grid-column:1}.detail-grid{grid-template-columns:1fr}.modal-backdrop{padding:7px}.modal{max-height:96vh}.modal-body{padding:16px}.modal-head{padding:16px}.modal-foot{padding:12px 16px}.search{min-width:100%;flex-basis:100%}.toolbar .field{flex:1}.settings-grid{grid-template-columns:1fr}.page-head .btn{font-size:11px;padding:8px}}

<body>
<div id="root"></div>
<script>
const API='/api/crm';
const state={token:sessionStorage.getItem('navyToken')||'',user:null,boot:null,leads:[],division:'all',view:'all',layout:'table',q:'',status:'all',selected:null,detail:null,modal:null,users:[],busy:false};
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:state.token,...data})});let j;try{j=await r.json()}catch{throw Error('The server returned an invalid response. Check your Apps Script deployment.')}if(!j.ok)throw Error(j.error||'Request failed');return j.data}
function toast(msg,error=false){const n=document.createElement('div');n.className='toast'+(error?' error':'');n.textContent=msg;document.body.append(n);setTimeout(()=>n.remove(),3600)}
function initials(n){return (n||'U').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function canAdmin(){return state.user?.role==='admin'}function canManage(){return ['admin','manager'].includes(state.user?.role)}function canTakeover(){return canManage()||state.user?.permissions?.takeover===true}
function divisionName(d){return d==='academic'?'Navy Infosys Academy':'Service Division'}
function statusName(s){return state.boot?.statuses?.find(x=>x.statusId===s)?.name||s||'New'}
function statusClass(s){return ({new:'blue',contacted:'gray',interested:'green',followup:'amber',converted:'green',lost:'red'})[s]||'gray'}
function dateFmt(v,withTime=false){if(!v)return '—';const d=new Date(v);if(isNaN(d))return v;return d.toLocaleString([],withTime?{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}:{day:'2-digit',month:'short',year:'numeric'})}
function dueClass(v){return v&&new Date(v)<new Date()?'due':''}
function loginView(){ $('#root').innerHTML=`<div class="login-screen"><form class="login-card" id="loginForm"><div class="login-brand"><div class="brand-mark">N</div><div><strong style="color:#14243b;letter-spacing:.1em">NAVY INFOSYS</strong><span style="color:#8190a4;display:block">LEAD MANAGEMENT CRM</span></div></div><h1>Welcome back</h1><p>Sign in to manage your leads and follow-ups.</p><div class="form-group"><label>Email address</label><input class="field" type="email" name="email" required autocomplete="username" placeholder="you@company.com"></div><div class="form-group"><label>Password</label><input class="field" type="password" name="password" required autocomplete="current-password" placeholder="Enter your password"></div><button class="btn primary" style="width:100%;justify-content:center;margin-top:8px">Sign in to CRM</button><p id="loginError" class="small" style="color:#b74440;margin:12px 0 0"></p></form></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const x=await api('login',{email:f.get('email'),password:f.get('password')});state.token=x.token;sessionStorage.setItem('navyToken',x.token);state.user=x.user;await loadBoot();render()}catch(err){$('#loginError').textContent=err.message}}}
async function loadBoot(){state.boot=await api('bootstrap');state.user=state.boot.user;state.leads=state.boot.leads||[];state.users=state.boot.users||[]}
function shell(){return `<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">N</div><div><strong>NAVY INFOSYS</strong><span>CRM WORKSPACE</span></div></div><nav class="nav"><div class="nav-label">WORKSPACE</div><button data-page="home" class="active"><span class="ico">▦</span>Overview</button><button data-page="leads"><span class="ico">♧</span>All Leads</button><button data-page="followups"><span class="ico">◷</span>Follow-ups <span id="navDue" class="pill amber" style="margin-left:auto">0</span></button><button data-page="activities"><span class="ico">↺</span>Activity Log</button><div class="nav-label">DIVISIONS</div><button data-page="service"><span class="ico">▣</span>Service Division</button><button data-page="academic"><span class="ico">⌂</span>Navy Infosys Academy</button><div class="nav-label ${canManage()?'':'hidden'}">MANAGEMENT</div><button data-page="employees" class="${canManage()?'':'hidden'}"><span class="ico">♙</span>Employees</button><button data-page="reports" class="${canManage()?'':'hidden'}"><span class="ico">▤</span>Reports</button><button data-page="import" class="${canManage()?'':'hidden'}"><span class="ico">⇧</span>Import / Export</button><button data-page="settings" class="${canAdmin()?'':'hidden'}"><span class="ico">⚙</span>Admin Settings</button></nav><div class="sidebar-bottom"><div class="profile"><div class="avatar">${initials(state.user.name)}</div><div style="min-width:0;flex:1"><strong>${esc(state.user.name)}</strong><small>${esc(state.user.role)} · Navy CRM</small></div><button class="btn sm" id="logout" title="Sign out">↗</button></div></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobile-menu" id="menuBtn">☰</button><div class="crumb">Navy Infosys <span style="color:#b3bdca">/</span> <b id="crumb">Overview</b></div></div><div class="top-actions"><span class="small muted">${new Date().toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'})}</span><div class="avatar">${initials(state.user.name)}</div></div></header><div class="content" id="page"></div></main>`}
function render(){if(!state.user){loginView();return}$('#root').innerHTML=shell();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#logout').onclick=logout;$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');go('home')}
async function logout(){try{await api('logout')}catch{}sessionStorage.removeItem('navyToken');state.token='';state.user=null;loginView()}
function go(page){state.page=page;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sidebar').classList.remove('open');const names={home:'Overview',leads:'Lead Management',followups:'Follow-ups',activities:'Activity Log',service:'Service Division',academic:'Navy Infosys Academy',employees:'Employees',reports:'Reports',import:'Import / Export',settings:'Admin Settings'};$('#crumb').textContent=names[page]||page;renderPage()}
async function refreshLeads(){state.leads=await api('listLeads',{division:state.division==='all'?'all':state.division});}
function dueLeads(list=state.leads){return list.filter(l=>l.nextFollowupAt&&new Date(l.nextFollowupAt)<=new Date())}
function statCard(label,value,foot,icon){return `<div class="card stat"><div class="stat-top"><span>${label}</span><span>${icon||'•'}</span></div><div class="stat-num">${value}</div><div class="stat-foot">${foot||''}</div></div>`}
function renderPage(){const p=$('#page');if(!p)return;({home:homePage,leads:leadsPage,service:()=>divisionPage('service'),academic:()=>divisionPage('academic'),followups:followupsPage,activities:activitiesPage,employees:employeesPage,reports:reportsPage,import:importPage,settings:settingsPage}[state.page]||homePage)()}
function homePage(){const all=state.leads,svc=all.filter(x=>x.division==='service'),aca=all.filter(x=>x.division==='academic'),due=dueLeads(all),over=due.filter(x=>new Date(x.nextFollowupAt).toDateString()!==new Date().toDateString()),unassigned=all.filter(x=>!x.assignedTo);$('#navDue').textContent=due.length;$('#page').innerHTML=`<div class="page-head"><div><h1>Good ${new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, ${esc(state.user.name.split(' ')[0])}</h1><p>Here's what needs attention across your workspace today.</p></div><button class="btn primary" id="addLead">＋ Add Lead</button></div><div class="grid stats">${statCard('Total Leads',all.length,'Across both divisions','♧')}${statCard('Follow-ups Due',due.length,'Due now or overdue','◷')}${statCard('Unassigned Leads',unassigned.length,'Waiting for an owner','♙')}${statCard('Converted Leads',all.filter(x=>x.status==='converted').length,'Successful conversions','✓')}</div><h2 class="section-title">Your divisions</h2><div class="grid division-grid"><div class="card division-card" data-open-div="service"><div class="div-icon">▣</div><h2>Service Division</h2><p>Digital marketing, IT services and business enquiries</p><div class="mini-stats"><div><b>${svc.length}</b><span>Total leads</span></div><div><b>${dueLeads(svc).length}</b><span>Follow-ups due</span></div><div><b>${svc.filter(x=>x.status==='interested').length}</b><span>Interested</span></div></div><div class="div-foot"><span>Open Service Workspace</span><span>→</span></div></div><div class="card division-card academic" data-open-div="academic"><div class="div-icon">⌂</div><h2>Navy Infosys Academy</h2><p>Training enquiries, courses and student admissions</p><div class="mini-stats"><div><b>${aca.length}</b><span>Total leads</span></div><div><b>${dueLeads(aca).length}</b><span>Follow-ups due</span></div><div><b>${aca.filter(x=>x.status==='interested').length}</b><span>Interested</span></div></div><div class="div-foot"><span>Open Academic Workspace</span><span>→</span></div></div></div><div class="grid" style="grid-template-columns:1.3fr .7fr"><div class="card panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 class="section-title" style="margin:0">Due follow-ups</h2><button class="btn sm" data-go="followups">View all →</button></div>${due.slice(0,6).map(l=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #f0f2f6"><div><div class="lead-name" data-detail="${l.leadId}">${esc(l.name)}</div><div class="small muted">${divisionName(l.division)} · ${esc(l.interestedIn||'No interest selected')}</div></div><div class="${dueClass(l.nextFollowupAt)} small">${dateFmt(l.nextFollowupAt,true)}</div></div>`).join('')||'<div class="empty">No follow-ups due. You are all caught up.</div>'}</div><div class="card panel"><h2 class="section-title">Lead pipeline</h2>${(state.boot.statuses||[]).filter(s=>s.active===true||s.active==='true').map(s=>{const n=all.filter(l=>l.status===s.statusId).length;return `<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px"><span>${esc(s.name)}</span><b>${n}</b></div><div style="height:6px;background:#edf1f6;border-radius:8px;overflow:hidden"><div style="height:100%;width:${all.length?100*n/all.length:0}%;background:#477fc9;border-radius:8px"></div></div></div>`}).join('')}</div></div>`;$('#addLead').onclick=()=>leadModal();document.querySelectorAll('[data-open-div]').forEach(x=>x.onclick=()=>go(x.dataset.openDiv));document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));wireDetails()}

let parsedImport=[];function parseCsv(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&q&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);const headers=(rows.shift()||[]).map(x=>x.trim().toLowerCase().replace(/[\s-]+/g,'_'));return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()])))}
async function previewCsv(e){const file=e.target.files[0];if(!file)return;const text=await file.text();parsedImport=parseCsv(text);const div=$('#importDivision').value;const existing=state.leads;let dup=0,invalid=0;const required=(state.boot.fieldConfig||[]).filter(f=>(f.division==='both'||f.division===div)&&String(f.required)==='true').map(f=>f.fieldKey);parsedImport.forEach(x=>{if(required.some(k=>!String(x[k]||'').trim()))invalid++;if(existing.some(l=>l.contact.replace(/\D/g,'')===String(x.contact).replace(/\D/g,'')||(x.email&&l.email?.toLowerCase()===x.email.toLowerCase())))dup++});$('#importPreview').innerHTML=`<div class="muted-box"><b>${parsedImport.length} rows detected</b><br>${invalid} missing name/contact · ${dup} possible duplicates · ${parsedImport.length-invalid-dup} likely new rows<br><span class="small">Division: ${divisionName(div)}. Duplicate and invalid rows will be skipped.</span></div>`;$('#runImport').disabled=!parsedImport.length}

async function runExport(){let a=state.leads,d=$('#exportDivision').value,s=$('#exportStatus').value;if(d!=='all')a=a.filter(x=>x.division===d);if(s!=='all')a=a.filter(x=>x.status===s);const cols=[...document.querySelectorAll('#exportFields input:checked')].map(x=>x.value);if(!cols.length)return toast('Select at least one column.',true);try{const data=await api('exportLeads',{division:d,status:s});downloadCsv(data,'navy-crm-export.csv',cols);toast(data.length+' leads exported.')}catch(e){toast(e.message,true)}}

dConfig',{field:f});await loadBoot();settingPanel('fields');toast('Field settings saved.')}catch(e){toast(e.message,true)}});$('#addCustomField').onclick=customFieldModal;}else if(['stages','sources','reasons'].includes(tab)){const cfg={stages:{title:'Lead stages',sheet:'STATUSES',items:state.boot.statuses,id:'statusId'},sources:{title:'Lead sources',sheet:'SOURCES',items:state.boot.sources,id:'sourceId'},reasons:{title:'Lost reasons',sheet:'LOST_REASONS',items:state.boot.lostReasons,id:'reasonId'}}[tab];p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 class="section-title">${cfg.title}</h2><button class="btn primary sm" id="addReference">＋ Add</button></div><p class="small muted">Manage the options used throughout the CRM. Deactivated items remain on historical records.</p><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>ID</th><th>Division</th><th>Active</th><th></th></tr></thead><tbody>${cfg.items.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x[cfg.id])}</td><td>${esc(x.division||'both')}</td><td>${String(x.active)==='true'?'Yes':'No'}</td><td><button class="btn sm" data-editref="${esc(x[cfg.id])}">Edit</button></td></tr>`).join('')}</tbody></table></div>`;$('#addReference').onclick=()=>referenceModal(cfg,null);document.querySelectorAll('[data-editref]').forEach(b=>b.onclick=()=>referenceModal(cfg,cfg.items.find(x=>x[cfg.id]===b.dataset.editref)));}else if(tab==='permissions'){p.innerHTML=`<h2 class="section-title">Employee permissions</h2><p class="small muted">Permissions are set per user in the Employees sheet / user record. Use the employee creation form for initial permissions.</p><div class="muted-box"><b>viewAllLeads</b> — view all leads in permitted divisions.<br><b>takeover</b> — take ownership of another employee's lead.<br><b>editUnassigned</b> — edit unassigned leads.<br><br>Example JSON: <code>{"viewAllLeads":true,"takeover":true,"editUnassigned":true}</code></div>`}else{p.innerHTML=`<h2 class="section-title">Database & backup</h2><p class="small muted">Your Google Spreadsheet is the portable source of truth.</p><div class="muted-box">Run <b>createDailyBackupTrigger()</b> once from Apps Script to create a daily copy of the CRM spreadsheet in Google Drive. Run <b>backupDatabase()</b> manually to create an immediate backup. Keep an independent XLSX export too.</div><a class="btn" target="_blank" rel="noopener" href="https://drive.google.com/drive/my-drive">Open Google Drive ↗</a>`}}
function customFieldModal(){showModal('Add custom lead field',`<form id="customFieldForm"><div class="form-grid"><div class="form-group"><label>Field label *</label><input class="field" name="label" required placeholder="e.g. Preferred batch"></div><div class="form-group"><label>Unique field ID *</label><input class="field" name="fieldId" required placeholder="preferredBatch"></div><div class="form-group"><label>Division</label><select class="field" name="division"><option value="both">Both divisions</option><option value="service">Service</option><option value="academic">Academy</option></select></div><div class="form-group"><label>Field type</label><select class="field" name="type"><option value="text">Text</option><option value="number">Number</option><option value="date">Date</option><option value="select">Dropdown</option><option value="textarea">Long text</option></select></div><div class="form-group"><label>Dropdown options (comma separated)</label><input class="field" name="options" placeholder="Morning, Afternoon, Evening"></div><div class="form-group"><label>Section</label><select class="field" name="section"><option value="additional">Additional information</option><option value="essential">Essential information</option></select></div><div class="form-group"><label><input type="checkbox" name="required"> Required</label></div><div class="form-group"><label><input type="checkbox" name="visible" checked> Visible</label></div></div></form>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="saveCustomField">Create field</button>`);$('#saveCustomField').onclick=async()=>{const f=$('#customFieldForm');if(!f.reportValidity())return;const x=Object.fromEntries(new FormData(f).entries());x.required=f.required.checked;x.visible=f.visible.checked;x.active=true;x.optionsJson=JSON.stringify((x.options||'').split(',').map(s=>s.trim()).filter(Boolean));x.sortOrder=100;delete x.options;try{await api('saveCustomField',{field:x});await loadBoot();closeModal();settingPanel('fields');toast('Custom field created.')}catch(e){toast(e.message,true)}}}
function referenceModal(cfg,item){const id=cfg.id;showModal(item?'Edit '+cfg.title:'Add '+cfg.title,`<form id="referenceForm"><div class="form-grid"><div class="form-group"><label>Name *</label><input class="field" name="name" required value="${esc(item?.name||'')}"></div><div class="form-group"><label>Stable ID *</label><input class="field" name="${id}" required value="${esc(item?.[id]||'')}" ${item?'readonly':''} placeholder="e.g. new-stage"></div><div class="form-group"><label>Division</label><select class="field" name="division"><option value="both" ${!item||item.division==='both'?'selected':''}>Both</option><option value="service" ${item?.division==='service'?'selected':''}>Service</option><option value="academic" ${item?.division==='academic'?'selected':''}>Academy</option></select></div>${cfg.sheet==='STATUSES'?`<div class="form-group"><label>Order</label><input class="field" name="sortOrder" type="number" value="${esc(item?.sortOrder||10)}"></div><div class="form-group"><label><input type="checkbox" name="isFinal" ${String(item?.isFinal)==='true'?'checked':''}> Final stage</label></div>`:''}<div class="form-group"><label><input type="checkbox" name="active" ${!item||String(item.active)==='true'?'checked':''}> Active</label></div></div></form>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="saveReference">Save</button>`);$('#saveReference').onclick=async()=>{const f=$('#referenceForm');if(!f.reportValidity())return;const x=Object.fromEntries(new FormData(f).entries());x.active=f.active.checked;if(cfg.sheet==='STATUSES')x.isFinal=f.isFinal.checked;try{await api('saveReference',{sheetName:cfg.sheet,item:x});await loadBoot();closeModal();settingPanel(cfg.sheet==='STATUSES'?'stages':cfg.sheet==='SOURCES'?'sources':'reasons');toast('Configuration saved.')}catch(e){toast(e.message,true)}}}
// Boot
(async()=>{if(!state.token){loginView();return}try{await loadBoot();render()}catch(e){sessionStorage.removeItem('navyToken');state.token='';loginView()}})();
</script>
</body></html>
